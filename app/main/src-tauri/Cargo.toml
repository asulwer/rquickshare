[package]
name = "rquickshare"
version.workspace = true
default-run = "rquickshare"
edition = "2021"
authors = ["martichou", "asulwer"]
repository = "https://github.com/asulwer/rquickshare"
license = "AGPL-3.0"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
anyhow = "1.0.104"
fern = { version = "0.7", features = ["colored"] }
hostname = "0.4.2"
humantime = "2.4"
log = "0.4.34"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
rqs_lib = { path = "../../../core_lib", features = ["experimental"] }
# No "devtools": debug builds always have the inspector, and release builds
# shouldn't ship it.
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.7"
tauri-plugin-notification = "2.7"
tauri-plugin-single-instance = "2.5"
tauri-plugin-store = "2.5"
tauri-plugin-dialog = "2.8"
tauri-plugin-clipboard-manager = "2.5"
time = { version = "0.3.55", features = ["formatting"] }
tokio = { version = "1.54", features = ["macros", "rt", "rt-multi-thread", "net", "sync", "time", "io-util"] }
tauri-plugin-opener = "2.7"
# Installs a newer release from inside the app. See `updater.rs`.
tauri-plugin-updater = "2.14"
# To order release versions the way the Release workflow numbers them.
semver = "1"
# `generate_context!` embeds the `plugins` section of tauri.conf.json as
# serde_json values, and expands to code that names this crate.
serde_json = "1"

# Only to reach the GTK window behind the Tauri one, so the Wayland titlebar
# bug in the tao we're pinned to can be patched at startup - see
# `fix_wayland_titlebar`. Same version tauri itself already pulls in.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
# Linux notifications with Accept/Reject buttons; elsewhere the Tauri
# notification plugin is used.
notify-rust = "4.18"

[features]
# by default Tauri runs in production mode
# when `tauri dev` runs it is executed with `cargo run --no-default-features` if `devPath` is an URL
default = ["custom-protocol"]
# this feature is used used for production builds where `devPath` points to the filesystem
# DO NOT remove this
custom-protocol = ["tauri/custom-protocol"]
