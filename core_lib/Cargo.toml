[package]
name = "rqs_lib"
version.workspace = true
edition = "2021"
authors = ["martichou", "asulwer"]
repository = "https://github.com/asulwer/rquickshare"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "core_bin"
path = "src/bin.rs"

[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "0.17", features = ["full"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Devices_Bluetooth_Advertisement",
    # GATT service provider: Quick Share receivers advertise a connectable
    # GATT service (isPrivateGatt), not a plain beacon, so the phone lists them.
    "Devices_Bluetooth_GenericAttributeProfile",
    "Devices_WiFiDirect",
    "Devices_WiFi",
    # WiFiDirectConnectionListener hands back a DeviceInformation for the peer;
    # accepting the connection means resolving it by id.
    "Devices_Enumeration",
    # The Bluetooth radio's state, so the nearby-sharing listener starts
    # again when Bluetooth turns back on.
    "Devices_Radios",
    "Networking",
    "Networking_Connectivity",
    "Networking_NetworkOperators",
    "Security_Credentials",
    "Storage_Streams",
    "Foundation",
    "Foundation_Collections",
    "Win32_System_Com",
    # NotifyUnicastIpAddressChange: the address the phone's hotspot hands us,
    # waited for as an event rather than polled.
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
], optional = true }
# AsyncOperationCompletedHandler and the IAsync* types live here since
# windows 0.59; `windows` uses them but doesn't re-export the handler.
windows-future = { version = "0.3.2", optional = true }

[dependencies]
aes = "0.9"
aes-gcm = "0.11"
anyhow = "1.0.104"
base64 = "0.23"
btleplug = { version = "0.13", optional = true }
bytes = "1.12"
directories = "6.0"
futures = "0.3.34"
hex = "0.4"
hkdf = "0.13"
hmac = "0.13"
hostname = "0.4.2"
if-addrs = "0.15"
cbc = { version = "0.2", features = ["alloc"] }
log = "0.4.34"
# The published upstream crate, not Martichou's `unsolicited` fork. That fork
# exists to expose `register_resend` (a forced re-announcement), but it is
# pinned to a *branch* of a 0.10.4 snapshot from Feb 2024 whose maintainer is
# inactive - so we were missing two years of DNS-parser hardening on untrusted
# multicast input (name-compression loops, read_u16 length checks, RDATA
# checks). Upstream documents `register()` as the way to re-announce, which
# covers what we used `register_resend` for.
mdns-sd = "0.21"
mime_guess = "2.0.5"
num-bigint = "0.5"
p256 = { version = "0.14", features = ["ecdh", "ecdsa"] }
prost = "0.14"
rand = "0.10"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
socket2 = "0.6"
tokio = { version = "1.54", features = ["macros", "rt", "rt-multi-thread", "net", "sync", "time", "io-util", "signal"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ts-rs = { version = "12.0", features = ["serde-compat"] }
uuid = "1.29"

[build-dependencies]
prost-build = "0.14"

[features]
default = ["experimental"]
experimental = ["bluer", "btleplug", "windows", "windows-future"]
