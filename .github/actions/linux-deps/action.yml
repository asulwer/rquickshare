name: Linux build dependencies
description: >
  System packages every Rust job in this repo needs on Linux. The webkit/soup
  4.1 packages only exist from Ubuntu 24.04 onwards, so runners must be pinned
  to ubuntu-24.04 or newer.

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libdbus-1-dev \
          libgtk-3-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          libsoup-3.0-dev \
          libjavascriptcoregtk-4.1-dev \
          libwebkit2gtk-4.1-dev
