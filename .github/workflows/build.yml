# Proves the app still bundles on every supported OS. Correctness lives in
# check.yml, so nothing here gates on tests and nothing gates on anything else.
name: Build

on:
  push:
    branches: [ "master" ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build_tauri:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
          # Apple Silicon. macos-13 (the Intel image) was retired: its jobs sat
          # queued for 24h and were cancelled, never running.
          - os: macos-latest
          - os: windows-latest
    env:
      TARGET_PATH: app/main
      # The repo is a Cargo workspace, so build output lands in the root
      # target/, not app/main/src-tauri/target/.
      BUNDLE_DIR: target/debug/bundle
      BUNDLE_NAME: main
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/main/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: app/main/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/linux-deps
        if: runner.os == 'Linux'

      - name: GLIBC version
        if: runner.os == 'Linux'
        run: ldd --version | head -n1

      - name: Build Vite + Tauri
        # bash everywhere, including Windows (Git Bash), where the default
        # shell would be PowerShell.
        shell: bash
        run: |
          rm -rf "${BUNDLE_DIR}"
          (cd "${TARGET_PATH}" && pnpm install --frozen-lockfile && pnpm build:debug)
          # Third argument marks the bundle as a debug build in its filename;
          # without it debug and release artifacts are named identically.
          ./rename_build.sh "${BUNDLE_DIR}" "${BUNDLE_NAME}" debug

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: artifact-debug-rquickshare-${{ matrix.os }}
          # Debug bundles are large and only useful while the PR is open.
          retention-days: 7
          path: ${{ env.BUNDLE_DIR }}/*/r-quick-share-${{ env.BUNDLE_NAME }}*
          # Fail rather than warn: an empty upload means the bundle path is
          # wrong, which is exactly how this used to pass while uploading nothing.
          if-no-files-found: error
