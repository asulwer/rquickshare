name: Create Release

# Builds the installers for a tag and attaches them to that tag's release.
#
# Normally called by release-please.yml right after it creates a release.
# Pushing a tag does not start this on its own any more: that trigger only
# worked with a PAT, because GitHub never lets the built-in token's tag pushes
# start other workflows. Run it by hand to rebuild or re-attach a release.
on:
  workflow_call:
    inputs:
      tag_name:
        description: 'Tag to build'
        type: string
        required: true
      publish:
        description: 'Attach the installers to the release for this tag'
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to build'
        required: true
      publish:
        description: >-
          Attach the installers to the existing GitHub release for this tag.
          Off: artifacts only, nothing is published.
        type: boolean
        default: false

jobs:
  # Runs first and alone: a tag that disagrees with the manifest means the
  # release would ship binaries whose in-app version is wrong, and that is far
  # cheaper to catch here than after publishing.
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag_name }}
      - name: Tag matches the workspace version
        run: |
          tag="${{ inputs.tag_name }}"
          manifest=$(sed -n '/^\[workspace\.package\]/,/^\[/p' Cargo.toml \
            | sed -n 's/^version *= *"\(.*\)"/\1/p' | head -n1)
          if [ -z "$manifest" ]; then
            echo "::error::could not read [workspace.package] version from Cargo.toml"
            exit 1
          fi
          echo "tag=${tag} manifest=v${manifest}"
          if [ "$tag" != "v${manifest}" ]; then
            echo "::error::tag ${tag} does not match Cargo.toml version v${manifest}"
            exit 1
          fi

  build_release:
    needs: verify
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Uploading release assets needs write access to the repo's contents.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            # No AppImage. It bundles all of WebKitGTK and GTK and compresses
            # them, which made the Linux release take ~40 minutes against a few
            # for macOS and Windows. Add AppImage back here to ship it again;
            # rename_build.sh still handles it.
            bundles: deb,rpm
          # Apple Silicon. macos-13 (the Intel image) was retired: its jobs sat
          # queued for 24h and were cancelled, never running.
          - os: macos-latest
          - os: windows-latest
    env:
      TARGET_PATH: app/main
      # The repo is a Cargo workspace, so build output lands in the root
      # target/, not app/main/src-tauri/target/.
      BUNDLE_DIR: target/release/bundle
      BUNDLE_NAME: main
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag_name }}
      - uses: pnpm/action-setup@v5
        with:
          package_json_file: app/main/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/main/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # protoc for prost-build. A composite action (no Node runtime):
      # arduino/setup-protoc is still on the deprecated Node 20.
      - uses: taiki-e/install-action@v2
        with:
          tool: protoc

      - uses: ./.github/actions/linux-deps
        if: runner.os == 'Linux'

      - name: Build Vite + Tauri
        # bash everywhere, including Windows (Git Bash), where the default
        # shell would be PowerShell.
        shell: bash
        env:
          # Empty where the matrix sets no `bundles`: Tauri then builds every
          # format for that OS.
          BUNDLES: ${{ matrix.bundles }}
        run: |
          rm -rf "${BUNDLE_DIR}"
          (cd "${TARGET_PATH}" && pnpm install --frozen-lockfile && pnpm build ${BUNDLES:+--bundles "$BUNDLES"})
          ./rename_build.sh "${BUNDLE_DIR}" "${BUNDLE_NAME}"

      # Always when release-please calls this; on a manual run only when
      # `publish` is ticked.
      #
      # `gh release upload` only adds assets. softprops/action-gh-release
      # edited the release before uploading, and GitHub refused that edit
      # whatever token was used. gh is preinstalled on GitHub-hosted runners.
      #
      # The upload uses the built-in GITHUB_TOKEN (contents: write, above):
      # GitHub creates it per run, so it never expires.
      - name: Add files to release
        if: inputs.publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag_name }}
        run: |
          shopt -s nullglob
          files=( "${BUNDLE_DIR}"/*/r-quick-share-"${BUNDLE_NAME}"* )
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no installers found under ${BUNDLE_DIR}"
            exit 1
          fi
          printf 'uploading %s\n' "${files[@]}"
          # --clobber replaces an asset of the same name, so re-running is safe.
          gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"

      # Manual runs only. Inside a call from release-please.yml, event_name is
      # the caller's ("push"), so release builds skip this.
      - name: Upload artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: artifact-release-rquickshare-${{ matrix.os }}
          path: ${{ env.BUNDLE_DIR }}/*/r-quick-share-${{ env.BUNDLE_NAME }}*
          if-no-files-found: error
