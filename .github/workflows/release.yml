name: Create Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to build (artifacts only, nothing is published)'
        required: true
  push:
    tags:
      # Only release-please's tags. A stray `git tag wip` used to start a full
      # three-runner release build and publish whatever it produced.
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  # Runs first and alone: a tag that disagrees with the manifest means the
  # release would ship binaries whose in-app version is wrong, and that is far
  # cheaper to catch here than after publishing.
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}
      - name: Tag matches the workspace version
        run: |
          tag="${{ inputs.tag_name || github.ref_name }}"
          manifest=$(sed -n '/^\[workspace\.package\]/,/^\[/p' Cargo.toml \
            | sed -n 's/^version *= *"\(.*\)"/\1/p' | head -n1)
          if [ -z "$manifest" ]; then
            echo "::error::could not read [workspace.package] version from Cargo.toml"
            exit 1
          fi
          echo "tag=${tag} manifest=v${manifest}"
          if [ "$tag" != "v${manifest}" ]; then
            echo "::error::tag ${tag} does not match Cargo.toml version v${manifest}"
            exit 1
          fi

  build_release:
    needs: verify
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
          - os: macos-latest
          - os: macos-13
    env:
      TARGET_PATH: app/main
      BUNDLE_NAME: main
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/main/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: app/main/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/linux-deps
        if: runner.os == 'Linux'

      - name: Build Vite + Tauri
        run: |
          rm -rf "${TARGET_PATH}/src-tauri/target/release/bundle/"
          cd "./${TARGET_PATH}"
          pnpm install --frozen-lockfile
          pnpm build
          cd "${GITHUB_WORKSPACE}"
          ./rename_build.sh "${TARGET_PATH}/src-tauri/target/release/bundle/" "${BUNDLE_NAME}"

      - name: Add files to release
        if: github.event_name != 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.TARGET_PATH }}/src-tauri/target/release/bundle/*/r-quick-share-${{ env.BUNDLE_NAME }}*
          fail_on_unmatched_files: true

      - name: Upload artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: artifact-release-rquickshare-${{ matrix.os }}
          path: ${{ env.TARGET_PATH }}/src-tauri/target/release/bundle/*/r-quick-share-${{ env.BUNDLE_NAME }}*
