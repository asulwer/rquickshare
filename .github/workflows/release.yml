name: Release

# Builds the installers and publishes a release. Start it from the Actions tab:
# Release > Run workflow.
#
# The version is <major>.<YY>.<DDD>.<build>, e.g. 1.26.298.42:
#   major  The [workspace.package] version's first number in Cargo.toml.
#          Changed by hand only (`pnpm bump major`).
#   YY     Two-digit year, in UTC, when the run starts.
#   DDD    Day of the year (1-366), in UTC. 26.298 is October 25, 2026.
#   build  This workflow's run number. It only goes up, so two releases on the
#          same day still get increasing versions.
#
# The tag, the release, the installer file names, the .msi and .exe installers
# and the version the app shows all read 1.26.298.42. Cargo only takes three
# numbers, so Cargo.toml gets 1.26.298+42 and Tauri turns the +42 back into the
# fourth number for the Windows installers.
#
# In-app updates: every installer is signed for tauri-plugin-updater, and the
# release carries a latest.json pointing the app at them. That needs, in the
# repo's Actions settings:
#   secret   TAURI_SIGNING_PRIVATE_KEY           from `pnpm tauri signer generate`
#   secret   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password, if it has one
#   variable TAURI_UPDATER_PUBKEY                the matching public key
# The public key is built into the app, which then only installs downloads that
# key's private half signed. Keep the same pair: a new one can't update apps
# built with the old public key.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: >-
          Tag the commit and publish a GitHub release with the installers.
          Off: build only, and keep the installers as workflow artifacts.
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      cargo_version: ${{ steps.version.outputs.cargo_version }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        name: Work out the version
        env:
          PUBLISH: ${{ inputs.publish }}
          RUN_NUMBER: ${{ github.run_number }}
          HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          if [ "$PUBLISH" = "true" ] && [ "$GITHUB_REF" != "refs/heads/master" ]; then
            echo "::error::releases are published from master only; untick publish to build ${GITHUB_REF_NAME}"
            exit 1
          fi
          # Checked here, before three OSes spend their time building
          # installers that the updater couldn't use.
          if [ "$HAS_SIGNING_KEY" != "true" ] || [ -z "$UPDATER_PUBKEY" ]; then
            echo "::error::the TAURI_SIGNING_PRIVATE_KEY secret and the TAURI_UPDATER_PUBKEY variable must both be set; see the top of release.yml"
            exit 1
          fi

          major=$(sed -n '/^\[workspace\.package\]/,/^\[/p' Cargo.toml \
            | sed -n 's/^version *= *"\([0-9]\{1,\}\)\..*"/\1/p' | head -n1)
          if [ -z "$major" ]; then
            echo "::error::could not read the major version from [workspace.package] in Cargo.toml"
            exit 1
          fi
          # The .msi caps the first two numbers at 255 and the others at 65535.
          if [ "$major" -gt 255 ]; then
            echo "::error::major version ${major} is over 255, the most an .msi allows"
            exit 1
          fi
          if [ "$RUN_NUMBER" -gt 65535 ]; then
            echo "::error::run number ${RUN_NUMBER} is over 65535, the most a Windows file version allows"
            exit 1
          fi

          yy=$(date -u +%y)
          ddd=$(date -u +%j)
          # 10# reads them as decimal, so the leading zeros of a day like 009
          # aren't taken for octal and don't end up in the version.
          date_part="${major}.$((10#${yy})).$((10#${ddd}))"
          version="${date_part}.${RUN_NUMBER}"
          cargo_version="${date_part}+${RUN_NUMBER}"

          if git ls-remote --exit-code --tags origin "refs/tags/v${version}" > /dev/null; then
            echo "::error::tag v${version} already exists"
            exit 1
          fi

          echo "version ${version} (Cargo.toml ${cargo_version})"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "cargo_version=${cargo_version}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            # No AppImage. It bundles all of WebKitGTK and GTK and compresses
            # them, which made the Linux release take ~40 minutes against a few
            # for macOS and Windows. Add AppImage back here to ship it again;
            # rename_build.sh still handles it.
            bundles: deb,rpm
          # Apple Silicon. macos-13 (the Intel image) was retired: its jobs sat
          # queued for 24h and were cancelled, never running.
          - os: macos-latest
          - os: windows-latest
    env:
      TARGET_PATH: app/main
      # The repo is a Cargo workspace, so build output lands in the root
      # target/, not app/main/src-tauri/target/.
      BUNDLE_DIR: target/release/bundle
      BUNDLE_NAME: main
      VERSION: ${{ needs.version.outputs.version }}
      CARGO_VERSION: ${{ needs.version.outputs.cargo_version }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          package_json_file: app/main/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/main/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      # No rust-cache. The version stamp rebuilds our crates anyway, and a
      # release's cache was always evicted before the next release (the repo
      # sits at GitHub's 10 GB cache limit), so saving one cost time and pushed
      # out the caches Build and Check do reuse.

      # protoc for prost-build. A composite action (no Node runtime):
      # arduino/setup-protoc is still on the deprecated Node 20.
      - uses: taiki-e/install-action@v2
        with:
          tool: protoc

      - uses: ./.github/actions/linux-deps
        if: runner.os == 'Linux'

      # Only in this checkout; the version is never committed. The app and the
      # installers take it from Cargo.toml.
      - name: Stamp the version
        shell: bash
        run: node scripts/bump.mjs "$CARGO_VERSION"

      - name: Build Vite + Tauri
        # bash everywhere, including Windows (Git Bash), where the default
        # shell would be PowerShell.
        shell: bash
        env:
          # Empty where the matrix sets no `bundles`: Tauri then builds every
          # format for that OS.
          BUNDLES: ${{ matrix.bundles }}
          # Signs each installer for the updater, writing a .sig beside it.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          rm -rf "${BUNDLE_DIR}"
          # Only releases sign for the updater and carry its key. tauri.conf.json
          # leaves the key empty, so other builds neither need the private key
          # nor check for updates. node writes the JSON so the key is escaped.
          updater_conf="${RUNNER_TEMP}/updater.conf.json"
          node -e 'process.stdout.write(JSON.stringify({
            bundle: { createUpdaterArtifacts: true },
            plugins: { updater: { pubkey: process.env.UPDATER_PUBKEY } },
          }))' > "$updater_conf"
          (cd "${TARGET_PATH}" && pnpm install --frozen-lockfile && pnpm build ${BUNDLES:+--bundles "$BUNDLES"} --config "$updater_conf")
          ./rename_build.sh "${BUNDLE_DIR}" "${BUNDLE_NAME}"

      - name: Upload installers
        uses: actions/upload-artifact@v6
        with:
          name: rquickshare-${{ env.VERSION }}-${{ matrix.os }}
          path: ${{ env.BUNDLE_DIR }}/*/r-quick-share-${{ env.BUNDLE_NAME }}*
          if-no-files-found: error

  # Runs only once every OS has built, so a release never goes out with some of
  # its installers missing.
  publish:
    needs: [version, build]
    if: inputs.publish
    runs-on: ubuntu-24.04
    # Creating the tag and the release, and uploading to it.
    permissions:
      contents: write
    steps:
      # For scripts/updater-manifest.mjs.
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts
      - uses: actions/download-artifact@v7
        with:
          path: installers
          pattern: rquickshare-${{ needs.version.outputs.version }}-*
          merge-multiple: true
      # The built-in GITHUB_TOKEN: GitHub creates it per run, so there's
      # nothing to renew. gh is preinstalled on GitHub-hosted runners.
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.version.outputs.version }}
          CARGO_VERSION: ${{ needs.version.outputs.cargo_version }}
        run: |
          shopt -s nullglob globstar extglob
          # The .sig files go into latest.json, not onto the release page.
          files=( installers/**/r-quick-share-!(*.sig) )
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no installers were downloaded"
            exit 1
          fi
          # Announces the release to the in-app updater. The app compares
          # versions the way Cargo spells them, so it gets 1.26.298+42.
          node scripts/updater-manifest.mjs installers "$CARGO_VERSION" "$TAG" "$GITHUB_REPOSITORY" > latest.json
          files+=( latest.json )
          printf 'attaching %s\n' "${files[@]}"
          # Tags the exact commit that was built. The notes list the pull
          # requests merged since the previous release.
          gh release create "$TAG" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes
