# Everything that can fail without building a bundle. Split out of the old
# lint.yml so a broken lint reports as "Check / lint_js" rather than hiding
# inside a build, and so none of it waits on Tauri.
name: Check

on:
  push:
    branches: [ "master" ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # Warnings fail the build. Linux and Windows compile different BLE / Wi-Fi
  # code (bluer vs WinRT), so each needs its own run.
  clippy:
    name: clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: protoc
      - uses: ./.github/actions/linux-deps
        if: runner.os == 'Linux'
      # Same placeholder as test_rust: generate_context!() needs app/main/dist.
      - shell: bash
        run: mkdir -p app/main/dist && echo '<!doctype html>' > app/main/dist/index.html
      - run: cargo clippy --workspace --all-features --all-targets -- -D warnings

  test_rust:
    name: cargo test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # protoc for prost-build. A composite action (no Node runtime):
      # arduino/setup-protoc is still on the deprecated Node 20.
      - uses: taiki-e/install-action@v2
        with:
          tool: protoc
      - uses: ./.github/actions/linux-deps
      # tauri::generate_context!() embeds the built frontend at compile time
      # (custom-protocol, on by default and via --all-features), so it needs
      # app/main/dist to exist. These are Rust tests, not UI tests, so a
      # placeholder stands in for a full `pnpm vite:build`.
      - run: mkdir -p app/main/dist && echo '<!doctype html>' > app/main/dist/index.html
      # --workspace picks up app/main/src-tauri, which the old `cd core_lib`
      # form never ran.
      - run: cargo test --workspace --all-features

  frontend:
    name: ${{ matrix.script }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - script: lint
            run: pnpm lint
          - script: ts-check
            run: pnpm ts-check
          # The only suite today is tests/unit/example.test.ts asserting
          # 1 === 1. Wired up so the first real test is enforced for free;
          # --passWithNoTests keeps the job honest if that stub is deleted.
          - script: test
            run: pnpm vitest run --passWithNoTests
    defaults:
      run:
        working-directory: app/main
    steps:
      - uses: actions/checkout@v7
      # No `version:` - action-setup reads packageManager from the app's
      # package.json, so CI and local stay on the same pnpm. The root
      # package.json only holds the bump script, hence the explicit path.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: app/main/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/main/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: ${{ matrix.run }}
