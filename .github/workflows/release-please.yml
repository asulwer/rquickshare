name: Release please flow

on:
  push:
    branches:
      - master
    tags-ignore:
      - '**'

env:
  CARGO_TERM_COLOR: always

jobs:
  # One release-please run does both halves: if the commit is a merged release
  # PR it creates the tag and GitHub release, otherwise it opens or updates the
  # release PR. It uses the built-in GITHUB_TOKEN, so there is no PAT to renew.
  # The release PR still relies on "Allow GitHub Actions to create and approve
  # pull requests" (Settings > Actions > General).
  release_please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5

  # Builds and attaches the installers when a release was just created.
  #
  # Called directly rather than started by the new tag: anything the built-in
  # token does - including pushing that tag - deliberately does not trigger
  # other workflows, which is the only reason a PAT used to be needed here.
  build_release:
    needs: release_please
    if: needs.release_please.outputs.release_created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag_name: ${{ needs.release_please.outputs.tag_name }}
      publish: true
